name: Build and Deploy Docs

on:
  workflow_dispatch:
  workflow_call:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Build Jekyll site
        run: bundle exec jekyll build
        working-directory: docs

      - name: Deploy site via rsync
        env:
          SSHPASS: ${{ secrets.RSYNC_PASSWORD }}
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "Error: RSYNC_PASSWORD secret is not set"
            exit 1
          fi

          set +e
          sshpass -e rsync -avz --progress --exclude='.git/' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            docs/_site/ \
            su525639@access-5019329309.webspace-host.com:tkweek
          RSYNC_EXIT_CODE=$?
          set -e

          if [ "$RSYNC_EXIT_CODE" -ne 0 ]; then
            echo "Error: rsync failed with exit code $RSYNC_EXIT_CODE"
            exit "$RSYNC_EXIT_CODE"
          fi

          echo "rsync completed successfully"
